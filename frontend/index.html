<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CR Portal</title>
    <!-- Paint the app's ground + a quiet spinner immediately, so a hard reload
         (e.g. Chrome discarding a backgrounded tab) never flashes white before
         React mounts. #boot lives inside #root and is replaced on first render. -->
    <style>
      :root { color-scheme: light; }
      html, body { margin: 0; height: 100%; background: #F4F6FB; }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: #F4F6FB;
      }
      #boot .r {
        width: 30px; height: 30px; border-radius: 50%;
        border: 3px solid rgba(12, 16, 27, 0.12);
        border-top-color: #CC4B12;
        animation: boot-spin 0.7s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #boot .r { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot"><div class="r"></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
